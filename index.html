  <!-- SPA redirect para GitHub Pages: restaura a rota original após o 404.html -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === "/") {
        var decoded = l.search.slice(1).split("&").map(function(s) {
          return s.replace(/~and~/g, "&");
        }).join("?");
        window.history.replaceState(null, "", "/elite-building-hub" + decoded.split("?")[0] + (decoded.includes("?") ? "?" + decoded.split("?").slice(1).join("?") : "") + l.hash);
      }
    }(window.location));
  </script>
